[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genai-chatbot"
version = "0.1.0"
description = "Generative AI chatbot built with Streamlit and Groq"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "streamlit",
  "python-dotenv",
  "langchain-community",
  "langchain-groq",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
genai-chatbot = "genai_chatbot.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
